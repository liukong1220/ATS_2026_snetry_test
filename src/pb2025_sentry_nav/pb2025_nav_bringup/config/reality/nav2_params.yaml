trajectory_optimizer:
  ros__parameters:
    use_sim_time: false
    input_path_topic: "plan"
    output_path_topic: "smoothed_path_visual"
    output_profile_topic: "trajectory_profile_visual"
    # 旁路可视化订阅全局 costmap，避免 RViz 青色线只显示几何样条而忽略 J_obs。
    costmap_topic: "global_costmap/costmap_raw"
    # 阶段二：旁路 optimizer 优先使用 traversability_grid 构造 ESDF，terrain_map_ext 保留为调试输入。
    esdf_source: "traversability_grid"
    terrain_pointcloud_topic: "terrain_map_ext"
    traversability_grid_topic: "traversability_grid"
    terrain_esdf_resolution: 0.05
    terrain_esdf_padding: 0.60
    terrain_esdf_inflation_radius: 0.08
    terrain_esdf_min_intensity: 0.0
    traversability_obstacle_value_threshold: 50
    traversability_unknown_is_obstacle: false
    # 控制点间距：越大越平滑，但越容易在拐角内侧切进膨胀层。
    # 当前用 0.24 保形，优先解决“转弯不跟线、抄近道”。
    control_point_spacing: 0.20
    output_path_spacing: 0.05
    min_input_point_spacing: 0.02
    # 最大横向偏移：限制 B 样条离原始全局路径的距离。
    # 当前压到 0.12，避免平滑器把路径抹进障碍膨胀层。
    max_lateral_deviation: 0.16
    min_control_points: 5
    # 曲率上限：当前不是追求极圆，而是避免曲率约束过硬导致路径贴墙。
    curvature_limit: 1.60
    curvature_weight: 10.0
    curvature_refinement_iterations: 2
    curvature_refinement_gain: 0.010
    # profile 速度上限与加速度：给 governor 使用，弯道会按曲率自动降速。
    global_speed_limit: 2.0
    lateral_accel_limit: 1.8
    longitudinal_accel_limit: 1.8
    velocity_smoothing_gain: 0.18
    derivative_step: 0.02
    # J_obs 参数：cost 超过 48 就开始推离障碍，权重比之前更强。
    obstacle_safe_cost: 48
    use_esdf_obstacle_cost: true
    obstacle_safe_distance: 0.30
    obstacle_weight: 40.0
    obstacle_refinement_iterations: 3
    obstacle_refinement_gain: 0.02

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: odometry
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 6.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # Parameter `xy_goal_tolerance`
      # 终点位置容差。实车贴点试探过强时可略增，过大则会提前结束导航。
      xy_goal_tolerance: 0.20
      # Parameter `yaw_goal_tolerance`
      # 当前巡逻/导航任务默认不强约束最终朝向，因此保持 2*pi。
      yaw_goal_tolerance: 6.28
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # 实车 MPPI 调参入口。
      # 推荐先结合 docs/mppi_parameter_tuning_guide.md 阅读，再在这份文件上微调。

      # --- Motion model ---
      # Parameter `motion_model`
      # 官方 MPPI 支持 `DiffDrive`、`Omni`、`Ackermann` 等模型。
      # 这里使用全向底盘模型，可同时优化 vx / vy / wz。
      motion_model: "Omni"

      # --- Optimizer settings ---
      # Parameter `time_steps`
      # 官方定义：`time_steps * model_dt` = prediction horizon。
      # 实车上时域过长时，转角和终点附近容易“想太远”；过短则提前量不足。
      time_steps: 30                     # Horizon T = 30 steps (1.5s at 20Hz)
      # Parameter `model_dt`
      # 官方建议：一般与控制周期一致，通常不要大于控制周期。
      model_dt: 0.05                     # 1/20 Hz
      # Parameter `batch_size`
      # 每周期采样轨迹数。官方经验值大致为：
      # 50Hz 时约 1000，30Hz 时约 2000；本项目需结合板载算力取折中。
      batch_size: 1000                    # K = 1000 samples (real robot)
      # Parameter `temperature`
      # 官方定义：越接近 0 越偏向最低代价控制，越大越接近对全部轨迹取平均。
      temperature: 0.10                  # Softmax temperature
      # Parameter `gamma`
      # 官方说明：这是控制能量/平滑正则项，通常不需要偏离默认值太多。
      gamma: 0.020                       # Discount factor
      iteration_count: 1                 # Single MPPI iteration per control cycle
      # Parameter `shift_control_sequence`
      # 使用上周期最优控制序列平移后做 warm-start，可明显减少控制抖动。
      shift_control_sequence: true       # Warm-start with shifted prior sequence
      retry_attempt_limit: 1             # Single fallback on all-collision

      # --- Velocity constraints (reality) ---
      # Parameters `vx_max / vx_min / vy_max / vy_min / wz_max / wz_min`
      # 这是 MPPI 的采样边界，不只是“车能跑多快”。
      # 官方调参建议里，这组参数通常是最优先检查的对象之一。
      # 如果这里设得远大于当前地形/底盘实际可控范围，rollout 会明显发散。
      vx_max: 3.5
      vx_min: -3.5
      vy_max: 3.5
      vy_min: -3.5
      wz_max: 3.0
      wz_min: -3.0

      # --- Sampling standard deviations ---
      # Parameters `vx_std / vy_std / wz_std`
      # std 越大，探索越强，但 trajectories 更容易扇形散开；
      # std 越小，更稳但更保守。
      vx_std: 0.38
      vy_std: 0.38
      wz_std: 0.30

      # --- Critics ---
      # 建议一次只改 1~2 个 critic，不要整组一起推翻，否则很难判断哪项生效。
      critics: [
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "ObstaclesCritic",
        "ConstraintCritic",
        "TwirlingCritic"
      ]

      # --- Per-critic weights ---
      PathAlignCritic:
        enabled: true
        cost_power: 1
        # Parameter `PathAlignCritic.cost_weight`
        # 惩罚偏离路径中心线。大了更贴线，但转角更僵、更容易来回修正。
        # 这里回调到更柔和的基线，减少角点处被旧路径强拉扯。
        cost_weight: 10.0
        # Parameter `PathAlignCritic.threshold_to_consider`
        # 官方文档将其定义为一个距离阈值，用于决定该 critic 的作用范围。
        threshold_to_consider: 0.8
        # Parameter `PathAlignCritic.offset_from_furthest`
        # 看向路径前方多远的位置做对齐参考。大了会更想切弯、更激进。
        offset_from_furthest: 5
        trajectory_point_step: 4
        max_path_occupancy_ratio: 0.05
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        # Parameter `PathFollowCritic.cost_weight`
        # 鼓励整体沿路径前进，比 PathAlign 更柔和。
        cost_weight: 7.0
        # Parameter `PathFollowCritic.threshold_to_consider`
        # 官方文档将其定义为一个距离阈值，用于决定该 critic 的作用范围。
        threshold_to_consider: 1.4
        offset_from_furthest: 4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        # Parameter `PathAngleCritic.cost_weight`
        # 处理轨迹朝向与路径方向严重不一致的问题，是抑制反向试探的重要项。
        cost_weight: 4.5
        # Parameter `PathAngleCritic.threshold_to_consider`
        # 官方文档将其定义为一个距离阈值，用于决定该 critic 的作用范围。
        threshold_to_consider: 0.5
        offset_from_furthest: 3
        # Parameter `PathAngleCritic.max_angle_to_furthest`
        # 越小越严格。太小会拐角发僵，太大则更容易横漂或反向抽动。
        max_angle_to_furthest: 0.85
        # fake gimbal yaw 需要稳定的前向参考，避免巡航时路径朝向被反向采样打散。
        forward_preference: true
      GoalCritic:
        enabled: true
        cost_power: 1
        # Parameter `GoalCritic.cost_weight`
        # 终点位置收敛的核心参数。终点前左右摆动时优先看它。
        cost_weight: 7.0
        # Parameter `GoalCritic.threshold_to_consider`
        # 官方文档将其定义为一个距离阈值，用于决定该 critic 的作用范围。
        threshold_to_consider: 1.8
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        # Parameter `GoalAngleCritic.cost_weight`
        # 虽然不强约束最终朝向，但保留适中角度代价能减少末端乱摆。
        cost_weight: 3.0
        # Parameter `GoalAngleCritic.threshold_to_consider`
        # 官方文档将其定义为一个距离阈值，用于决定该 critic 的作用范围。
        threshold_to_consider: 0.5
        symmetric_yaw_tolerance: true
      ObstaclesCritic:
        enabled: true
        consider_footprint: true
        cost_power: 1
        # Parameter `ObstaclesCritic.repulsion_weight`
        # 官方文档说明这项调节与 inflation layer 半径成比例，应联合调整。
        # 数值越大越早躲障，但也更容易被障碍代价场推离路径。
        repulsion_weight: 1.6
        # Parameter `ObstaclesCritic.critical_weight`
        # 近碰撞的强惩罚，通常应明显大于其他路径 critic。
        critical_weight: 60.0
        # Parameter `ObstaclesCritic.collision_margin_distance`
        # 在真实碰撞边界外再留一层安全距离。
        collision_margin_distance: 0.08
        # Parameter `ObstaclesCritic.near_goal_distance`
        # 终点附近适度降低障碍回避敏感度，避免贴点时被代价场轻微推开。
        near_goal_distance: 0.35
        # Parameter `ObstaclesCritic.inflation_radius`
        # 官方文档明确要求：这里应与 costmap inflation layer 保持一致。
        inflation_radius: 0.50
        cost_scaling_factor: 5.0
      ConstraintCritic:
        enabled: true
        cost_power: 1
        # Parameter `ConstraintCritic.cost_weight`
        # 惩罚违反速度/加速度等约束的轨迹，通常保持中等权重即可。
        cost_weight: 4.0
      TwirlingCritic:
        enabled: true
        cost_power: 1
        # Parameter `TwirlingCritic.cost_weight`
        # 抑制原地转圈。终点附近疯狂打圈时可适度增大。
        cost_weight: 10.0
      VelocityDeadbandCritic:
        enabled: false
        cost_power: 1
        # Parameter `VelocityDeadbandCritic.cost_weight`
        # 抑制死区附近的小幅抖动，特别适合解决“快停下时还在抽搐”。
        cost_weight: 35.0
        # Parameter `VelocityDeadbandCritic.deadband_velocities`
        deadband_velocities: [0.05, 0.05, 0.05]

      # --- Visualization ---
      # Parameter `visualize`
      # 实车联调时建议保留，可配合 RViz 查看 rollout 是否发散。
      # 官方文档同时提醒：部署时保持 true 会增加算力开销，应谨慎使用。
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: gimbal_yaw_fake
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25]]"
      footprint_padding: 0.02
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        track_unknown_space: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        combination_method: 1
        mark_threshold: 0
        origin_z: 0.0
        unknown_threshold: 5
        self_filter_radius: 0.42
        z_resolution: 0.05
        z_voxels: 16
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        min_obstacle_intensity: 0.1
        max_obstacle_intensity: 2.0
        observation_sources: terrain_map
        terrain_map:
          data_type: PointCloud2
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: <robot_namespace>/terrain_map
          sensor_frame: front_mid360
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.35
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.50
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: gimbal_yaw_fake
      footprint: "[[0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25]]"
      footprint_padding: 0.02
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        track_unknown_space: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        combination_method: 1
        mark_threshold: 0
        origin_z: 0.0
        unknown_threshold: 5
        self_filter_radius: 0.42
        z_resolution: 0.05
        z_voxels: 16
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        min_obstacle_intensity: 0.1
        max_obstacle_intensity: 2.0
        observation_sources: terrain_map_ext
        terrain_map_ext:
          data_type: PointCloud2
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: <robot_namespace>/terrain_map_ext
          sensor_frame: front_mid360
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.35
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 全局层保守于局部层，用来把全局路由尽量拉回通道中心。
        cost_scaling_factor: 6.0
        inflation_radius: 0.55
      always_send_full_costmap: False

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
map_server:
  ros__parameters:
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.3                      # 如果无法到达精确位置的规划容差，单位：米
      allow_unknown: true                 # 允许在未知空间中行驶
      downsample_costmap: false           # 是否对地图进行下采样
      downsampling_factor: 1              # 代价地图层分辨率的倍数 (e.g. 2 on a 5cm costmap would be 10cm)
      max_iterations: 1000000             # 搜索的最大总迭代次数（如果无法到达），设置为-1以禁用
      max_on_approach_iterations: 1000    # 一旦在容差范围内，尝试到达目标的最大迭代次数
      max_planning_time: 3.5              # 规划、平滑和上采样的最大时间（秒）。将根据规划后的剩余时间缩放最大平滑和上采样时间。
      cost_travel_multiplier: 2.2         # For 2D: 官方说明数值越大越会贴近通道中心。保持旧实车基线，避免为远离代价区过度绕路。
      motion_model_for_search: "DUBIN"    # For Hybrid Dubin, Redds-Shepp
      angle_quantization_bins: 64         # For Hybrid nodes: 搜索的角度桶数，对于2D节点必须为1（无角度搜索）
      analytic_expansion_ratio: 3.5       # For Hybrid/Lattice nodes: 在搜索过程中尝试解析扩展的比例，用于最终接近。
      analytic_expansion_max_length: 3.6  # For Hybrid/Lattice nodes: 解析扩展被认为有效的最大长度，以防止不安全的捷径（单位：米）。这应该与最小转弯半径成比例，不应小于最小半径的4-5倍。
      minimum_turning_radius: 0.07        # For Hybrid/Lattice nodes: 全向底盘不应被建模成 0.6m 大转弯半径车辆，否则会明显绕远。
      retrospective_penalty: 0.07        # For Hybrid/Lattice nodes: 优先考虑路径上较晚的机动而不是较早的机动。节省搜索时间，因为较早的节点不会被扩展，直到有必要。必须 >= 0.0且 <= 1.0
      reverse_penalty: 1.0                # For Reeds-Shepp model: 应用于倒车的惩罚，必须 >= 1
      change_penalty: 0.0                 # For Hybrid nodes: 应用于改变方向的惩罚，必须 >= 0
      non_straight_penalty: 1.20          # For Hybrid nodes: 应用于非直线运动的惩罚，必须 >= 1
      cost_penalty: 2.3                   # For Hybrid nodes: 保持旧实车基线，降低因高代价惩罚导致的绕远。
      rotation_penalty: 5.0               # For Lattice node: 仅在使用包含原地旋转原语的最小控制集时应用于纯原地旋转命令的惩罚。除非严格必要用于避开障碍物，否则应始终设置足够高的权重，以避免此操作，否则可能会在路径中频繁出现不连续的情况，要求机器人原地旋转以节省路径距离。
      lookup_table_size: 20.0             # For Hybrid nodes: 缓存的dubin/reeds-sheep距离窗口的大小，单位：米。
      cache_obstacle_heuristic: True      # For Hybrid nodes: 在同一目标位置的后续重新规划之间缓存障碍物地图动态规划距离扩展启发式。如果代价地图基本静态，则显著加快重新规划性能（40倍）。
      allow_reverse_expansion: False      # For Lattice node: 是否在前向原语或反向扩展状态格子图中扩展，将使每一步的分支因子加倍。
      smooth_path: True                   # For Lattice/Hybrid nodes: 使用旧实车基线的 Smac 内置平滑，再由 B 样条做受限二次平滑和速度剖面。
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["bspline_smoother", "fallback_smoother"]
    bspline_smoother:
      plugin: "trajectory_optimizer/Nav2BSplineSmoother"
      # 与 trajectory_optimizer 保持同一组参数；BT 主链真正跟踪的是这里输出的路径。
      control_point_spacing: 0.22
      output_path_spacing: 0.05
      min_input_point_spacing: 0.02
      max_lateral_deviation: 0.16
      min_control_points: 5
      curvature_limit: 1.60
      curvature_weight: 10.0
      curvature_refinement_iterations: 4
      curvature_refinement_gain: 0.014
      global_speed_limit: 2.4
      lateral_accel_limit: 2.2
      longitudinal_accel_limit: 2.6
      velocity_smoothing_gain: 0.28
      derivative_step: 0.02
      profile_topic: "trajectory_profile"
      # 阶段二：主链 smoother 与旁路 trajectory_optimizer 使用同一套 traversability ESDF。
      esdf_source: "traversability_grid"
      terrain_pointcloud_topic: "terrain_map_ext"
      traversability_grid_topic: "traversability_grid"
      terrain_esdf_resolution: 0.05
      terrain_esdf_padding: 0.60
      terrain_esdf_inflation_radius: 0.08
      terrain_esdf_min_intensity: 0.0
      traversability_obstacle_value_threshold: 50
      traversability_unknown_is_obstacle: false
      # cost 超过 96 的点会被回拉；profile 会在回拉后重新计算并发给 governor。
      obstacle_safe_cost: 96
      use_esdf_obstacle_cost: true
      obstacle_safe_distance: 0.30
      obstacle_weight: 16.0
      obstacle_refinement_iterations: 3
      obstacle_refinement_gain: 0.02
      max_path_cost: 120
      footprint_collision_cost_threshold: 253
      pullback_samples: 8
      collision_skip_initial_points: 8
      collision_skip_initial_distance: 0.45
    fallback_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "pb_nav2_behaviors/BackUpFreeSpace"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: gimbal_yaw_fake
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    # params for pb_nav2_behaviors/BackUpFreeSpace
    service_name: "global_costmap/get_costmap"
    max_radius: 1.6
    # 高于该 cost 的膨胀区不再被当作“可脱困方向”，防止恢复动作继续贴墙试探。
    max_allowed_cost: 96
    # 以车尾为中心的搜索半角。增大后更愿意尝试斜后退/侧后退，更适合全向舵轮。
    search_half_span_deg: 120.0
    # 候选方向角分辨率。越小搜索越细致，但每次恢复规划计算量略增。
    search_angle_increment_deg: 10.0
    # 兼容旧参数：若不单独配置近/远采样，则用它作为统一纵向采样间距。
    trajectory_sample_step: 0.06
    # 第一阶段优化：近距离密采样、远距离疏采样。
    # 近距离更密，优先保证底盘身边安全；远距离更疏，降低算力。
    near_sample_step: 0.04
    far_sample_step: 0.08
    # 近采样和远采样的切换距离。
    layered_sampling_split_distance: 0.40
    # 恢复轨迹走廊半宽，等价于给底盘留出的横向安全裕量。调大后更保守。
    corridor_half_width: 0.18
    # 近距离走廊横向采样间距。越小越严谨，越大越省算力。
    corridor_lateral_step: 0.06
    # 远距离走廊横向采样可适当更稀疏，进一步减少计算量。
    far_corridor_lateral_step: 0.10
    # 若整条恢复目标不全通，允许至少释放这么长的安全段先走出去。
    # 太小会重新引入“碎步试探”；太大则可能放行机会太少。
    minimum_release_distance: 0.14
    # 第二阶段：是否开启“动态障碍前沿简单速度预测”。
    # 打开后会根据安全前缀长度变化趋势，提前判断恢复走廊是否将被动态障碍重新封堵。
    dynamic_obstacle_prediction_enabled: true
    # 安全前缀向前预测的时间窗。
    prediction_horizon_s: 0.45
    # 安全前缀速度估计的低通系数。大：更灵敏；小：更稳。
    prefix_velocity_alpha: 0.35
    # 预测判断时保留的安全余量，防止刚好卡在阈值边界反复切换。
    predictive_block_margin: 0.10
    # 对上一条恢复方向的“黏性”。调大后方向更稳，调小后更灵活但更容易左右抽动。
    heading_stickiness_weight: 6.0
    # 两次重规划之间的最短时间。调大后更稳，调小后更敏捷。
    replanning_cooldown_s: 0.35
    # 连续多少拍都检测到轨迹前缀被挡住，才真正进入 BLOCKED。
    blocked_enter_cycles: 3
    # 连续多少拍都重新畅通，才从 BLOCKED 退出，避免边界抖动。
    clear_exit_cycles: 2
    # 允许的最大重规划次数，超过后恢复动作失败，交还给上层恢复链。
    max_replan_attempts: 6
    # 一阶低通时间常数。增大后恢复更顺滑，但响应会变慢。
    speed_filter_tau: 0.18
    # 恢复阶段平移加速度上限。减小可进一步保护电机，但会更肉。
    translational_acc_limit: 0.8
    # 恢复阶段平移减速度上限。适当大于加速度上限，便于更干净地收尾。
    translational_decel_limit: 1.2
    # 恢复阶段最小平移速度，防止末段在静摩擦附近抖动。
    minimum_speed_xy: 0.08
    # 视为“已经恢复到位”的距离容差。
    goal_tolerance: 0.04
    # 前视检测长度。增大后更早预判障碍，减小后动作更激进。
    monitor_lookahead_distance: 0.35
    # 后向搜索失败时，是否放开到全方向搜索，优先确保能脱困。
    enable_full_circle_fallback: true
    visualize: true

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

trajectory_speed_governor:
  ros__parameters:
    use_sim_time: false
    profile_topic: "trajectory_profile"
    input_cmd_vel_topic: "cmd_vel_controller"
    output_cmd_vel_topic: "cmd_vel_controller_governed"
    marker_topic: "trajectory_profile_markers"
    # 保持 governor 在链路中生效：用 B 样条 profile 做高速巡航的动态限速，而不是旁路透传。
    enabled: true
    min_speed_scale: 0.82
    curvature_brake_gain: 0.12
    curvature_window_points: 10
    curvature_peak_weight: 0.30
    speed_scale_filter_gain: 0.22
    speed_scale_rise_rate: 4.0
    speed_scale_fall_rate: 1.8

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 30.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [4.5, 4.5, 5.0]
    min_velocity: [-4.0, -4.0, -5.0]
    max_accel: [6.0, 6.0, 6.0]
    max_decel: [-7.0, -7.0, -6.0]
    odom_topic: "odometry"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

pb_teleop_twist_joy_node:
  ros__parameters:
    use_sim_time: false
    robot_base_frame: gimbal_yaw_odom
    control_mode: auto_control    # Option: auto_control, manual_control

    require_enable_button: true
    enable_button: 4              # L1 shoulder button
    enable_turbo_button: 5        # R1 shoulder button

    axis_chassis:
      x: 1                        # Left thumb stick vertical
      y: 0                        # Left thumb stick horizontal
      yaw: 6                      # button_left and button_right
    scale_chassis:
      x: 2.5
      y: 2.5
      yaw: 3.0
    scale_chassis_turbo:
      x: 4.0
      y: 4.0
      yaw: 6.0

    axis_gimbal:
      roll: -1                    # Disable
      pitch: 4                    # Right thumb stick vertical
      yaw: 3                      # Right thumb stick horizontal
    scale_gimbal:
      roll: 0.0
      pitch: -1.0
      yaw: 2.5
    scale_gimbal_turbo:
      roll: 0.0
      pitch: -1.5
      yaw: 3.5
