# Offline random map generator defaults.
# seed: -1 means a new random map each run; output still overwrites map/random.
output_root: "{package_root}/map"
map_name:
seed: 420
width: 420
height: 420
resolution: 0.05
obstacle_count: 30      # 60  30
min_obstacle_size: 10
max_obstacle_size: 30   # 34  30
border_thickness: 5
corridor_half_width: 8
pixel_threshold: 230
terrain_mode: hfield
terrain_height_scale: 0.45
terrain_negative_height: 0.03
terrain_blur_sigma: 0.0
input_map_image:
input_map_yaml:
dynamic_obstacles_enabled: false
dynamic_obstacle_count: 4
dynamic_obstacle_shape: cylinder
dynamic_obstacle_radius: 0.25
dynamic_obstacle_height: 1.2
dynamic_obstacle_mass: 20.0
dynamic_obstacle_speed: 0.35
dynamic_obstacle_path_length: 6.0
dynamic_obstacle_min_robot_distance: 1.8
dynamic_obstacle_near_robot_radius: 4.0
dynamic_obstacle_map_clearance: 0.35
dynamic_obstacle_replan_rate_hz: 1.0
