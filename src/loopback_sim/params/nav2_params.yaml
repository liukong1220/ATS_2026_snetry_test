trajectory_optimizer:
  ros__parameters:
    use_sim_time: True
    input_path_topic: "plan"
    output_path_topic: "smoothed_path_visual"
    output_profile_topic: "trajectory_profile_visual"
    # 旁路可视化也订阅全局 costmap，让青色 Smoothed Path 尽量反映 J_obs 后的结果。
    costmap_topic: "global_costmap/costmap_raw"
    # 控制点间距：越大，样条越“平”，越容易把拐角抹掉。
    # 当前缩小到 0.24，是为了减少弯角处 B 样条内切。
    control_point_spacing: 0.20
    # 输出路径采样间距：越小曲线越密，controller 看到的参考线越细。
    output_path_spacing: 0.05
    # 过滤过近输入点，避免控制点过多导致样条抖动。
    min_input_point_spacing: 0.02
    # 平滑结果允许偏离原始路径的最大横向距离。
    # 该值越大，越容易把路径抹进膨胀层；越小则更保形但更不平滑。
    max_lateral_deviation: 0.16
    # 最少控制点数，太少会失去样条表达能力。
    min_control_points: 5
    # 连续优化主开关：启用控制点级 L-BFGS，保留启发式 refinement 作后处理。
    use_continuous_optimization: true
    continuous_max_iterations: 30
    continuous_lbfgs_memory: 8
    continuous_gradient_tolerance: 1.0e-4
    continuous_initial_step: 0.20
    smoothness_weight: 8.0
    fitness_weight: 1.5
    endpoint_tangent_weight: 2.0
    corridor_weight: 10.0
    # 曲率上限：越小越强调“转弯不要太急”。
    # 但过小会让 optimizer 过度改形，可能导致贴边或抖动。
    # 当前放宽到 1.60，避免曲率约束为了“变圆”把曲线推向膨胀层。
    curvature_limit: 1.60
    # 曲率代价权重：决定超过曲率上限后惩罚有多重。
    # 过大时会把曲线修得过度保守，过小则抑制不了急弯。
    curvature_weight: 10.0
    # 曲率 refinement 迭代次数：越多越容易把局部急弯磨平。
    curvature_refinement_iterations: 2
    # 每次曲率修正的步长：越大修正越激进。
    curvature_refinement_gain: 0.010
    # 全局速度上限：整条路径的基础巡航速度。
    # 拐角过慢容易造成控制收敛到一起并抖动，过快又容易切弯。
    global_speed_limit: 1.20
    # 横向加速度上限：用于曲率限速时的安全约束。
    lateral_accel_limit: 0.75
    # 纵向加速度上限：越小越平顺，但也更容易在转弯前后“收得太慢”。
    longitudinal_accel_limit: 0.55
    # 速度平滑增益：用来削弱相邻采样点速度差。
    # 太大时会把速度剖面拉得过钝，太小时抖动会明显。
    velocity_smoothing_gain: 0.18
    # 数值导数步长：用于估计样条一阶/二阶导。
    derivative_step: 0.02
    # obstacle_safe_cost 以下视为安全区，超过后会逐步触发 obstacle refinement。
    obstacle_safe_cost: 48
    use_esdf_obstacle_cost: true
    obstacle_safe_distance: 0.30
    # 障碍代价权重：决定离障碍太近时修正力度。
    # 过大容易把轨迹推得过远，过小则拦不住切进膨胀层的趋势。
    # 当前提高到 55，让样条先离开高代价边缘，再交给 MPPI 跟踪。
    obstacle_weight: 40.0
    # 障碍 refinement 迭代次数：对太贴边的点进行回拉。
    obstacle_refinement_iterations: 3
    # 每次障碍修正的步长。
    obstacle_refinement_gain: 0.02

controller_server:
  ros__parameters:
    use_sim_time: True
    odom_topic: /odom
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 比较早地判定“已经卡住”，避免在角点和终点前长时间原地试探。
      required_movement_radius: 0.25
      movement_time_allowance: 6.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # Parameter `xy_goal_tolerance`
      # 位置到点容差。增大后更容易判定“到点”，能减少终点附近来回试探；
      # 过大则会出现“还没真正贴近目标就提前结束”。
      xy_goal_tolerance: 0.35
      # Parameter `yaw_goal_tolerance`
      # 当前巡逻任务不强调终点朝向，因此保持 2*pi，相当于不约束最终 yaw。
      yaw_goal_tolerance: 0.3
    # MPPI controller parameters (loopback simulation)
    # 这套参数是 loopback 决策仿真默认读取的 MPPI 配置，用于观察：
    # 1. trajectories 是否稳定贴近 transformed_global_plan
    # 2. 转角处是否左右试探 / 反向抽动
    # 3. 终点附近是否蛇形摆动或 overshoot
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # --- Motion model ---
      # Parameter `motion_model`
      # 官方 MPPI 支持 `DiffDrive`、`Omni`、`Ackermann` 等模型。
      # 这里使用全向底盘模型，可同时采样 vx / vy / wz。
      motion_model: "Omni"

      # --- Optimizer settings ---
      # Parameter `time_steps`
      # 官方定义：`time_steps * model_dt` = prediction horizon。
      # 预测太长：容易在窄弯、终点附近“想太远”，可视化 rollout 发散。
      # 预测太短：局部最优，拐弯可能来不及提前收敛。
      time_steps: 30
      # Parameter `model_dt`
      # 官方建议：一般与控制周期一致，通常不要大于控制周期。
      model_dt: 0.05
      # Parameter `batch_size`
      # 每周期采样多少条轨迹。官方经验值大致为：
      # 50Hz 时约 1000，30Hz 时约 2000；本项目需结合算力和频率折中。
      # 更大通常更稳，但更吃算力；过小会让最佳轨迹抖动明显。
      # 每周期采样轨迹数：适度提高有助于在弯角附近找到“贴线且不撞边”的候选。
      batch_size: 1700
      # Parameter `temperature`
      # 官方定义：越接近 0 越偏向最低代价控制，越大越接近对全部轨迹取平均。
      # 小：更激进，只盯最优样本，容易抖。
      # 大：更平滑，但也可能变钝。
      # 温度：略降，减少对一堆 shortcut 候选求平均导致的发散。
      temperature: 0.22
      # Parameter `gamma`
      # 官方说明：这是控制能量/平滑正则项，通常不需要偏离默认值太多。
      # 小：更愿意急打急停；大：更平滑，但可能转角收得慢。
      # 控制能量正则：略升，抑制弯前突然挤出大补偿。
      gamma: 0.035
      # Parameter `iteration_count`
      # 官方建议通常保持为 1，优先通过增加 `batch_size` 而不是增加迭代次数来提效果。
      iteration_count: 1
      # Parameter `shift_control_sequence`
      # 用上周期最优控制序列平移后做 warm-start，可显著减少抖动。
      shift_control_sequence: true
      # Parameter `retry_attempt_limit`
      # 若当前采样几乎全碰撞时，允许再尝试几次。loopback 中保持 1 足够。
      retry_attempt_limit: 1

      # --- Velocity constraints (loopback sim - TurtleBot3-like) ---
      # Parameters `vx_max / vx_min / vy_max / vy_min / wz_max / wz_min`
      # 这些是 MPPI 采样空间的硬约束，不只是“实际最大速度”。
      # 官方调参建议里，这组参数通常是最优先检查的对象之一。
      # 设得过大时，即使真实机器人跑不到，采样也会过分发散，导致 trajectories 乱飘。
      vx_max: 1.6
      vx_min: -1.6
      vy_max: 1.6
      vy_min: -1.6
      wz_max: 2.2
      wz_min: -2.2

      # --- Sampling standard deviations ---
      # Parameters `vx_std / vy_std / wz_std`
      # std 决定每周期围绕当前控制序列“抖多大”。
      # 过大：rollout 像扇形散开，中途和终点附近都容易左右试探。
      # 过小：会变得保守，局部最优卡住时不容易跳出来。
      # 采样扰动标准差：再收一点，减少弯前扇形散开和局部补偿堆积。
      vx_std: 0.3
      vy_std: 0.2
      wz_std: 0.3

      # --- Critics ---
      # critics 是代价项列表。MPPI 会综合这些 critic 给每条采样轨迹打分。
      # 一般不要一口气同时改很多 critic，建议一次只改 1~2 个核心项。
      # 权重速记：
      # - `cost_weight` / `repulsion_weight` / `critical_weight` 都是乘到对应代价上的权重。
      #   所以“权重调大”就是把数值调大，轨迹会更强烈地避开该 critic 惩罚的行为。
      # - `cost_power` 会改变代价曲线形状，通常保持 1；调权重时优先改 weight，不先改 power。
      # - `threshold_to_consider` 不是权重，而是距离目标点的生效窗口：
      #   PathAlign / PathFollow / PathAngle / PreferForward 在进入该距离后关闭；
      #   Goal / GoalAngle 在进入该距离后开启；Obstacles 的 near_goal_distance 会关闭普通斥力项。
      # - `offset_from_furthest` 是沿路径参考点的前视偏移，调大通常更积极，但更容易切弯。
      critics: [
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "ObstaclesCritic",
        "ConstraintCritic",
        "TwirlingCritic",
        "VelocityDeadbandCritic"
      ]

      PathAlignCritic:
        enabled: true
        cost_power: 1
        # Parameter `PathAlignCritic.cost_weight`
        # 惩罚 rollout 偏离局部路径中心线。权重调大=数值调大，会更强制贴线；
        # 但转角、障碍边缘和终段更容易僵硬、来回修正。
        # 当前比 15.0 略降，减少弯口被旧路径强拽，又保留基本贴线意愿。
        cost_weight: 13.0
        # Parameter `PathAlignCritic.threshold_to_consider`
        # 距目标小于该值时 PathAlign 关闭，让终段交给 GoalCritic。
        # 调大=更早放弃强制贴线；调小=更晚才退出，终点附近仍会被路径拉住。
        threshold_to_consider: 1.4
        # Parameter `PathAlignCritic.offset_from_furthest`
        # 从当前 rollout 已到达的最远路径点继续向前偏移多少个 path point 作为对齐范围。
        # 调大=看得更远、速度感更强，但更容易在弯口 shortcut；调小=更保守。
        # 缩短前视，避免在弯口直接追远点形成 shortcut。
        offset_from_furthest: 6
        # Parameter `PathAlignCritic.trajectory_point_step`
        # rollout 取样步长，越大越粗略但更省计算。
        trajectory_point_step: 3
        # Parameter `PathAlignCritic.max_path_occupancy_ratio`
        # 当局部路径大量落在高占用区域时，不再强行贴线，避免“为贴线去撞障”。
        max_path_occupancy_ratio: 0.05
        # Parameter `PathAlignCritic.use_path_orientations`
        # loopback 巡逻更关注位置，不强依赖路径姿态。
        # 暂时不用路径姿态，避免局部回拉后的角度突变让 MPPI 抽动。
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        # Parameter `PathFollowCritic.cost_weight`
        # 鼓励轨迹末端追向路径前方的 follow 点，而不是只贴中心线。
        # 权重调大=数值调大，会更积极沿路径推进；过大可能在转角抄近道。
        # 降一点，避免它只想着“往前推”而在转角抄近道。
        cost_weight: 4.0
        # Parameter `PathFollowCritic.threshold_to_consider`
        # 距目标小于该值时 PathFollow 关闭，避免终点附近继续“往前推”。
        # 调大=更早退出推进项；调小=更接近终点仍保持推进。
        threshold_to_consider: 1.4
        # Parameter `PathFollowCritic.offset_from_furthest`
        # 越大越倾向追逐更远的 follow 点，速度会快，但转角更容易 shortcut。
        offset_from_furthest: 1
      PathAngleCritic:
        enabled: true
        cost_power: 1
        # Parameter `PathAngleCritic.cost_weight`
        # 惩罚轨迹朝向与路径前方参考点方向不一致。权重调大=数值调大，
        # 会更强烈抑制反向试探和横切；过大时转角会发僵。
        # 再增强方向一致性，抑制拐角前后横切和迟钝转向。
        cost_weight: 10.0
        # Parameter `PathAngleCritic.threshold_to_consider`
        # 距目标小于该值时 PathAngle 关闭，让终段由 GoalAngle/Twirling 控制。
        # 调大=更早停止路径方向约束；调小=更靠近终点仍要求沿路径方向。
        threshold_to_consider: 1.3
        # Parameter `PathAngleCritic.offset_from_furthest`
        # 判断朝向一致性时使用的前方路径点偏移；调大更看远方，调小更看近处。
        offset_from_furthest: 3
        # Parameter `PathAngleCritic.max_angle_to_furthest`
        # 允许的最大夹角，越小越严格。
        # 太小可能导致拐弯发僵；太大则反向/横漂更容易出现。
        # 再收紧一点，让 controller 更愿意沿曲线方向转，而不是拖后大修正。
        max_angle_to_furthest: 0.4
        # Parameter `PathAngleCritic.forward_preference`
        # loopback 仿真阶段优先减少“先反一下再转”的试探，因此打开前向偏好。
        forward_preference: true
      GoalCritic:
        enabled: true
        cost_power: 1
        # Parameter `GoalCritic.cost_weight`
        # 惩罚 rollout 与最终目标点的距离，是终点收敛核心项。
        # 权重调大=数值调大，接近目标后更急着贴终点；过大可能提前压过路径项。
        # 如果接近目标时还在左右晃，优先考虑提高它或提高它的生效距离。
        cost_weight: 9.0
        # Parameter `GoalCritic.threshold_to_consider`
        # 距目标小于该值时 GoalCritic 才开启。
        # 调大=更早进入“贴终点”阶段；调小=更晚才由目标主导。
        threshold_to_consider: 1.8
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        # Parameter `GoalAngleCritic.cost_weight`
        # 终点姿态约束权重。权重调大=数值调大，会更重视最终 yaw；
        # 当前不严格要求终点朝向，只保留适度角度约束来减少末端乱摆。
        cost_weight: 2.0
        # Parameter `GoalAngleCritic.threshold_to_consider`
        # 距目标小于该值时 GoalAngleCritic 才开启；调大=更早开始收终点姿态。
        threshold_to_consider: 0.5
        # Parameter `GoalAngleCritic.symmetric_yaw_tolerance`
        # true 表示朝向误差按对称方式处理，适合这里“不关心最终面朝哪边”的场景。
        symmetric_yaw_tolerance: true
      ObstaclesCritic:
        enabled: true
        # 必须看 footprint，否则常出现“点没撞，身体进了膨胀层”的错觉。
        consider_footprint: true
        cost_power: 1
        # Parameter `ObstaclesCritic.repulsion_weight`
        # 官方文档说明这项调节与 inflation layer 半径成比例，应联合调整。
        # 普通障碍斥力权重。权重调大=数值调大，会更早远离膨胀层；
        # 过大也更容易把可视化 trajectories 顶得离路径很远。
        repulsion_weight: 5.0
        # Parameter `ObstaclesCritic.critical_weight`
        # 碰撞边界/安全余量内的重惩罚。权重调大=数值调大，会更强烈避开近碰撞轨迹；
        # 通常应明显大于一般路径 critic。
        critical_weight: 13.0
        # Parameter `ObstaclesCritic.collision_margin_distance`
        # 在真实碰撞边界外再加一层安全余量；调大更保守，窄通道更难过。
        collision_margin_distance: 0.25
        # Parameter `ObstaclesCritic.near_goal_distance`
        # 距目标小于该值时关闭普通 repulsion 斥力，只保留碰撞/近碰撞惩罚；
        # 调大可减少最后贴点被代价场推开，但目标附近真实障碍多时会更冒险。
        near_goal_distance: 0.5
        # Parameter `ObstaclesCritic.inflation_radius`
        # 官方文档明确要求：这里要与 costmap inflation layer 一致，否则 critic 语义会错位。
        inflation_radius: 0.55
        cost_scaling_factor: 5.0
      ConstraintCritic:
        enabled: true
        cost_power: 1
        # Parameter `ConstraintCritic.cost_weight`
        # 惩罚违反速度/加速度等运动学约束的轨迹。
        # 权重调大=数值调大，会更强烈排除越界控制；通常保持中等权重即可。
        cost_weight: 4.0
      TwirlingCritic:
        enabled: true
        cost_power: 1
        # Parameter `TwirlingCritic.cost_weight`
        # 抑制不必要自转。权重调大=数值调大，自转会更少；
        # 若看到临近终点疯狂转圈，可以适当增大。
        cost_weight: 7.0
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        # Parameter `VelocityDeadbandCritic.cost_weight`
        # 惩罚落在 deadband 内的“小但非零”速度。
        # 权重调大=数值调大，会更不愿输出死区小速度，终点附近轻微抽搐时通常有用；
        # 过大可能让低速细调不够柔和。
        cost_weight: 11.0
        # Parameter `VelocityDeadbandCritic.deadband_velocities`
        deadband_velocities: [0.05, 0.05, 0.05]

      # --- Visualization ---
      # Parameter `visualize`
      # 开启后 RViz 可查看 rollout 采样轨迹，是 MPPI 调参最重要的诊断窗口之一。
      # 官方文档同时提醒：部署时保持 true 会增加算力开销，应谨慎使用。
      visualize: true
      TrajectoryVisualizer:
        # Parameters `TrajectoryVisualizer.trajectory_step / TrajectoryVisualizer.time_step`
        # 越大，显示越稀疏；便于看趋势，不影响控制本身。
        trajectory_step: 5
        time_step: 3

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      # Parameters `local_costmap.width / local_costmap.height`
      # local_costmap 的窗口至少要能覆盖 MPPI 的主要预测范围。
      # 如果局部地图比 rollout 还短，就会出现“预测总顶到边界”的假性发散。
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[0.30, 0.30], [0.30, -0.30], [-0.30, -0.30], [-0.30, 0.30]]"
      footprint_padding: 0.03
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      footprint: "[[0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25]]"
      footprint_padding: 0.03
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.60
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: "/Users/zhiangqi/robostack/nav2_loopback_sim/maps/tb3_sandbox.yaml"

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.20
      allow_unknown: true
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.5
      cost_travel_multiplier: 2.9
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 64
      analytic_expansion_ratio: 2.0
      analytic_expansion_max_length: 1.2
      minimum_turning_radius: 0.50
      retrospective_penalty: 0.06
      reverse_penalty: 1.0
      change_penalty: 0.0
      non_straight_penalty: 1.20
      cost_penalty: 3.0
      rotation_penalty: 5.0
      lookup_table_size: 20.0
      cache_obstacle_heuristic: True
      allow_reverse_expansion: False
      smooth_path: False
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["bspline_smoother", "fallback_smoother"]
    bspline_smoother:
      plugin: "trajectory_optimizer/Nav2BSplineSmoother"
      # 与 trajectory_optimizer 保持一致的曲线参数，确保 BT 平滑和旁路可视化看到的是同一类轨迹。
      # 注意：这里的目标是“保形且可跟随”，不是把角全磨圆。
      control_point_spacing: 0.20
      output_path_spacing: 0.05
      min_input_point_spacing: 0.02
      max_lateral_deviation: 0.16
      min_control_points: 5
      use_continuous_optimization: true
      continuous_max_iterations: 30
      continuous_lbfgs_memory: 8
      continuous_gradient_tolerance: 1.0e-4
      continuous_initial_step: 0.20
      smoothness_weight: 8.0
      fitness_weight: 1.5
      endpoint_tangent_weight: 2.0
      corridor_weight: 10.0
      # 曲率上限：越小越强调“转弯不要太急”。
      curvature_limit: 1.60
      # 曲率代价权重：超过上限后的惩罚强度。
      curvature_weight: 10.0
      # 曲率 refinement 次数：用于把急弯磨圆。
      curvature_refinement_iterations: 2
      # 单次曲率修正步长：越大越激进。
      curvature_refinement_gain: 0.010
      # 全局速度上限：整条路径的基础巡航速度。
      # 当前略保守，避免弯前冲得太快导致 controller 过度收敛。
      global_speed_limit: 1.20
      # 横向加速度上限：用于曲率限速。
      lateral_accel_limit: 0.75
      # 纵向加速度上限：限制速度变化的快慢。
      longitudinal_accel_limit: 0.55
      # 速度平滑增益：抑制速度剖面抖动。
      velocity_smoothing_gain: 0.18
      # 数值导数步长：用于曲率和速度 profile 计算。
      derivative_step: 0.02
      # profile 对外发布的话题，实车联调时可以直接在 RViz 中看。
      profile_topic: "trajectory_profile"
      # 障碍安全 cost 阈值：低于它的格子认为是安全区。
      obstacle_safe_cost: 48
      use_esdf_obstacle_cost: true
      obstacle_safe_distance: 0.30
      # 障碍代价权重：越大越不愿意贴近高代价边缘。
      # 这里和 optimizer 保持一致，避免平滑器和主链对“安全距离”的理解打架。
      obstacle_weight: 40.0
      # 障碍 refinement 次数：对太贴边的点进行回拉。
      obstacle_refinement_iterations: 3
      # 每次障碍修正步长。
      obstacle_refinement_gain: 0.02
      max_path_cost: 48
      footprint_collision_cost_threshold: 253
      pullback_samples: 8
    fallback_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "ats_nav2_behaviors/BackUpFreeSpace"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: gimbal_yaw_fake
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    # params for ats_nav2_behaviors/BackUpFreeSpace
    service_name: "global_costmap/get_costmap"
    max_radius: 1.6
    max_allowed_cost: 96
    search_half_span_deg: 120.0
    search_angle_increment_deg: 10.0
    trajectory_sample_step: 0.06
    near_sample_step: 0.04
    far_sample_step: 0.08
    layered_sampling_split_distance: 0.40
    corridor_half_width: 0.18
    corridor_lateral_step: 0.06
    far_corridor_lateral_step: 0.10
    minimum_release_distance: 0.14
    dynamic_obstacle_prediction_enabled: true
    prediction_horizon_s: 0.45
    prefix_velocity_alpha: 0.35
    predictive_block_margin: 0.10
    heading_stickiness_weight: 6.0
    replanning_cooldown_s: 0.35
    blocked_enter_cycles: 3
    clear_exit_cycles: 2
    max_replan_attempts: 6
    speed_filter_tau: 0.18
    translational_acc_limit: 0.8
    translational_decel_limit: 1.2
    minimum_speed_xy: 0.08
    goal_tolerance: 0.04
    monitor_lookahead_distance: 0.35
    enable_full_circle_fallback: true
    visualize: true

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

trajectory_speed_governor:
  ros__parameters:
    use_sim_time: True
    profile_topic: "trajectory_profile"
    input_cmd_vel_topic: "cmd_vel_controller"
    output_cmd_vel_topic: "cmd_vel_controller_governed"
    marker_topic: "trajectory_profile_markers"
    # 最低保留速度比例：过低会让转弯处过分“缩成一团”。
    min_speed_scale: 0.40
    # 曲率制动增益：过大时弯前会过慢并把控制补偿挤在一起。
    # 当前降到 0.60，保留高曲率减速，但不让 governor 把 MPPI 压到爬行。
    curvature_brake_gain: 0.60
    curvature_window_points: 12
    speed_scale_filter_gain: 0.25

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # loopback_simulator 本身支持 linear.y，因此这里必须和 MPPI 的 Omni 模型一致；
    # 如果继续把 vy 限成 0，控制器采样与底层执行就会不一致，转角/终点附近会放大预测偏离。
    max_velocity: [1.6, 1.6, 2.2]
    min_velocity: [-1.6, -1.6, -2.2]
    max_accel: [1.4, 1.4, 2.5]
    max_decel: [-2.0, -2.0, -3.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan" # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    enable_stamped_cmd_vel: false
    update_duration: 0.02
    # 启动后先连续发布几拍 TF/odom，再开始发 scan，
    # 避免 RViz / Nav2 的 message filter 在 sim_time 下报“scan 早于 TF 缓存”。
    scan_tf_warmup_cycles: 3
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
