bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

trajectory_optimizer:
  ros__parameters:
    use_sim_time: True
    input_path_topic: "plan"
    output_path_topic: "smoothed_path_visual"
    control_point_spacing: 0.30
    output_path_spacing: 0.05
    min_input_point_spacing: 0.02
    max_lateral_deviation: 0.20
    min_control_points: 5

controller_server:
  ros__parameters:
    use_sim_time: True
    odom_topic: /odom
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 比较早地判定“已经卡住”，避免在角点和终点前长时间原地试探。
      required_movement_radius: 0.25
      movement_time_allowance: 6.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # Parameter `xy_goal_tolerance`
      # 位置到点容差。增大后更容易判定“到点”，能减少终点附近来回试探；
      # 过大则会出现“还没真正贴近目标就提前结束”。
      xy_goal_tolerance: 0.35
      # Parameter `yaw_goal_tolerance`
      # 当前巡逻任务不强调终点朝向，因此保持 2*pi，相当于不约束最终 yaw。
      yaw_goal_tolerance: 6.28
    # MPPI controller parameters (loopback simulation)
    # 这套参数是 loopback 决策仿真默认读取的 MPPI 配置，用于观察：
    # 1. trajectories 是否稳定贴近 transformed_global_plan
    # 2. 转角处是否左右试探 / 反向抽动
    # 3. 终点附近是否蛇形摆动或 overshoot
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # --- Motion model ---
      # Parameter `motion_model`
      # 官方 MPPI 支持 `DiffDrive`、`Omni`、`Ackermann` 等模型。
      # 这里使用全向底盘模型，可同时采样 vx / vy / wz。
      motion_model: "Omni"

      # --- Optimizer settings ---
      # Parameter `time_steps`
      # 官方定义：`time_steps * model_dt` = prediction horizon。
      # 预测太长：容易在窄弯、终点附近“想太远”，可视化 rollout 发散。
      # 预测太短：局部最优，拐弯可能来不及提前收敛。
      time_steps: 30
      # Parameter `model_dt`
      # 官方建议：一般与控制周期一致，通常不要大于控制周期。
      model_dt: 0.05
      # Parameter `batch_size`
      # 每周期采样多少条轨迹。官方经验值大致为：
      # 50Hz 时约 1000，30Hz 时约 2000；本项目需结合算力和频率折中。
      # 更大通常更稳，但更吃算力；过小会让最佳轨迹抖动明显。
      batch_size: 900
      # Parameter `temperature`
      # 官方定义：越接近 0 越偏向最低代价控制，越大越接近对全部轨迹取平均。
      # 小：更激进，只盯最优样本，容易抖。
      # 大：更平滑，但也可能变钝。
      temperature: 0.20
      # Parameter `gamma`
      # 官方说明：这是控制能量/平滑正则项，通常不需要偏离默认值太多。
      # 小：更愿意急打急停；大：更平滑，但可能转角收得慢。
      gamma: 0.020
      # Parameter `iteration_count`
      # 官方建议通常保持为 1，优先通过增加 `batch_size` 而不是增加迭代次数来提效果。
      iteration_count: 1
      # Parameter `shift_control_sequence`
      # 用上周期最优控制序列平移后做 warm-start，可显著减少抖动。
      shift_control_sequence: true
      # Parameter `retry_attempt_limit`
      # 若当前采样几乎全碰撞时，允许再尝试几次。loopback 中保持 1 足够。
      retry_attempt_limit: 1

      # --- Velocity constraints (loopback sim - TurtleBot3-like) ---
      # Parameters `vx_max / vx_min / vy_max / vy_min / wz_max / wz_min`
      # 这些是 MPPI 采样空间的硬约束，不只是“实际最大速度”。
      # 官方调参建议里，这组参数通常是最优先检查的对象之一。
      # 设得过大时，即使真实机器人跑不到，采样也会过分发散，导致 trajectories 乱飘。
      vx_max: 1.6
      vx_min: -1.6
      vy_max: 1.6
      vy_min: -1.6
      wz_max: 2.2
      wz_min: -2.2

      # --- Sampling standard deviations ---
      # Parameters `vx_std / vy_std / wz_std`
      # std 决定每周期围绕当前控制序列“抖多大”。
      # 过大：rollout 像扇形散开，中途和终点附近都容易左右试探。
      # 过小：会变得保守，局部最优卡住时不容易跳出来。
      vx_std: 0.16
      vy_std: 0.16
      wz_std: 0.28

      # --- Critics ---
      # critics 是代价项列表。MPPI 会综合这些 critic 给每条采样轨迹打分。
      # 一般不要一口气同时改很多 critic，建议一次只改 1~2 个核心项。
      critics: [
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "ObstaclesCritic",
        "ConstraintCritic",
        "TwirlingCritic",
        "VelocityDeadbandCritic"
      ]

      PathAlignCritic:
        enabled: true
        cost_power: 1
        # Parameter `PathAlignCritic.cost_weight`
        # 惩罚轨迹偏离路径中心线。
        # 大了会更“贴线”，但转角和障碍附近容易僵硬、来回修正。
        cost_weight: 5.0
        # Parameter `PathAlignCritic.threshold_to_consider`
        # 官方文档将其定义为一个距离阈值，用于决定该 critic 的作用范围。
        # 在本项目中可将它理解为：路径贴合项在终段还要不要继续强势介入。
        threshold_to_consider: 0.4
        # Parameter `PathAlignCritic.offset_from_furthest`
        # 用路径前方多远的位置做贴线参考。大了看得更远，容易切弯；小了更保守。
        offset_from_furthest: 6
        # Parameter `PathAlignCritic.trajectory_point_step`
        # rollout 取样步长，越大越粗略但更省计算。
        trajectory_point_step: 4
        # Parameter `PathAlignCritic.max_path_occupancy_ratio`
        # 当局部路径大量落在高占用区域时，不再强行贴线，避免“为贴线去撞障”。
        max_path_occupancy_ratio: 0.05
        # Parameter `PathAlignCritic.use_path_orientations`
        # loopback 巡逻更关注位置，不强依赖路径姿态。
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        # Parameter `PathFollowCritic.cost_weight`
        # 鼓励沿路径整体往前推进，而不是只盯着贴中心线。
        # 它比 PathAlign 更“宽松”，更像“顺着大方向走”。
        cost_weight: 7.5
        # Parameter `PathFollowCritic.threshold_to_consider`
        # 官方文档将其定义为一个距离阈值，用于决定该 critic 的作用范围。
        # 在本项目中可理解为：终段时 PathFollow 还要不要继续主导推进。
        threshold_to_consider: 1.4
        # Parameter `PathFollowCritic.offset_from_furthest`
        # 越大越倾向追逐更远的 follow 点，速度会快，但转角更容易 shortcut。
        offset_from_furthest: 4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        # Parameter `PathAngleCritic.cost_weight`
        # 处理“轨迹朝向与路径前进方向严重不一致”的情况。
        # 它通常是抑制反向试探、横着切弯的重要项。
        cost_weight: 5.0
        # Parameter `PathAngleCritic.threshold_to_consider`
        # 官方文档将其定义为一个距离阈值，用于决定该 critic 的作用范围。
        threshold_to_consider: 0.5
        # Parameter `PathAngleCritic.offset_from_furthest`
        offset_from_furthest: 3
        # Parameter `PathAngleCritic.max_angle_to_furthest`
        # 允许的最大夹角，越小越严格。
        # 太小可能导致拐弯发僵；太大则反向/横漂更容易出现。
        max_angle_to_furthest: 0.65
        # Parameter `PathAngleCritic.forward_preference`
        # loopback 仿真阶段优先减少“先反一下再转”的试探，因此打开前向偏好。
        forward_preference: true
      GoalCritic:
        enabled: true
        cost_power: 1
        # Parameter `GoalCritic.cost_weight`
        # 惩罚轨迹末端离目标点的距离，是“终点收敛”的第一核心参数。
        # 如果接近目标时还在左右晃，优先考虑提高它或提高它的生效距离。
        cost_weight: 9.0
        # Parameter `GoalCritic.threshold_to_consider`
        # 官方文档将其定义为一个距离阈值，用于决定该 critic 的作用范围。
        # 在本项目中可理解为：从多早开始让“贴终点”优先于“贴路径”。
        threshold_to_consider: 1.8
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        # Parameter `GoalAngleCritic.cost_weight`
        # 这里虽然不严格要求终点朝向，但保留适度角度约束能减少末端乱摆。
        cost_weight: 3.0
        # Parameter `GoalAngleCritic.threshold_to_consider`
        # 官方文档将其定义为一个距离阈值，用于决定该 critic 的作用范围。
        threshold_to_consider: 0.5
        # Parameter `GoalAngleCritic.symmetric_yaw_tolerance`
        # true 表示朝向误差按对称方式处理，适合这里“不关心最终面朝哪边”的场景。
        symmetric_yaw_tolerance: true
      ObstaclesCritic:
        enabled: true
        consider_footprint: true
        cost_power: 1
        # Parameter `ObstaclesCritic.repulsion_weight`
        # 官方文档说明这项调节与 inflation layer 半径成比例，应联合调整。
        # 越大越早躲障，但也更容易把可视化 trajectories 顶得离路径很远。
        repulsion_weight: 2.6
        # Parameter `ObstaclesCritic.critical_weight`
        # 近碰撞区域的重惩罚，通常保持远大于一般路径 critic。
        critical_weight: 30.0
        # Parameter `ObstaclesCritic.collision_margin_distance`
        # 在真实碰撞边界外再加一层“心理安全距离”。
        collision_margin_distance: 0.16
        # Parameter `ObstaclesCritic.near_goal_distance`
        # 终点附近降低障碍回避敏感度，避免“最后贴点时被微小代价场推开”。
        near_goal_distance: 0.4
        # Parameter `ObstaclesCritic.inflation_radius`
        # 官方文档明确要求：这里要与 costmap inflation layer 一致，否则 critic 语义会错位。
        inflation_radius: 0.40
        cost_scaling_factor: 10.0
      ConstraintCritic:
        enabled: true
        cost_power: 1
        # Parameter `ConstraintCritic.cost_weight`
        # 惩罚违反速度/加速度等运动学约束的轨迹，通常保持中等权重即可。
        cost_weight: 4.0
      TwirlingCritic:
        enabled: true
        cost_power: 1
        # Parameter `TwirlingCritic.cost_weight`
        # 抑制原地乱转。若看到临近终点疯狂转圈，可以适当增大。
        cost_weight: 10.0
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        # Parameter `VelocityDeadbandCritic.cost_weight`
        # 惩罚“很小但非零”的速度，防止控制输出在死区附近来回抖。
        # 终点附近轻微抽搐时，这项通常很有用。
        cost_weight: 35.0
        # Parameter `VelocityDeadbandCritic.deadband_velocities`
        deadband_velocities: [0.05, 0.05, 0.05]

      # --- Visualization ---
      # Parameter `visualize`
      # 开启后 RViz 可查看 rollout 采样轨迹，是 MPPI 调参最重要的诊断窗口之一。
      # 官方文档同时提醒：部署时保持 true 会增加算力开销，应谨慎使用。
      visualize: true
      TrajectoryVisualizer:
        # Parameters `TrajectoryVisualizer.trajectory_step / TrajectoryVisualizer.time_step`
        # 越大，显示越稀疏；便于看趋势，不影响控制本身。
        trajectory_step: 5
        time_step: 3

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      # Parameters `local_costmap.width / local_costmap.height`
      # local_costmap 的窗口至少要能覆盖 MPPI 的主要预测范围。
      # 如果局部地图比 rollout 还短，就会出现“预测总顶到边界”的假性发散。
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: 0.40
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.45
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: "/Users/zhiangqi/robostack/nav2_loopback_sim/maps/tb3_sandbox.yaml"

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["bspline_smoother", "fallback_smoother"]
    bspline_smoother:
      plugin: "trajectory_optimizer/Nav2BSplineSmoother"
      control_point_spacing: 0.30
      output_path_spacing: 0.05
      min_input_point_spacing: 0.02
      max_lateral_deviation: 0.18
      min_control_points: 5
    fallback_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "pb_nav2_behaviors/BackUpFreeSpace"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: gimbal_yaw_fake
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    # params for pb_nav2_behaviors/BackUpFreeSpace
    service_name: "global_costmap/get_costmap"
    max_radius: 2.0
    max_allowed_cost: 96
    search_half_span_deg: 140.0
    search_angle_increment_deg: 10.0
    trajectory_sample_step: 0.08
    near_sample_step: 0.05
    far_sample_step: 0.10
    layered_sampling_split_distance: 0.45
    corridor_half_width: 0.22
    corridor_lateral_step: 0.08
    far_corridor_lateral_step: 0.12
    minimum_release_distance: 0.18
    dynamic_obstacle_prediction_enabled: true
    prediction_horizon_s: 0.45
    prefix_velocity_alpha: 0.35
    predictive_block_margin: 0.10
    heading_stickiness_weight: 6.0
    replanning_cooldown_s: 0.35
    blocked_enter_cycles: 3
    clear_exit_cycles: 2
    max_replan_attempts: 6
    speed_filter_tau: 0.18
    translational_acc_limit: 0.8
    translational_decel_limit: 1.2
    minimum_speed_xy: 0.08
    goal_tolerance: 0.04
    monitor_lookahead_distance: 0.35
    enable_full_circle_fallback: true
    visualize: true

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # loopback_simulator 本身支持 linear.y，因此这里必须和 MPPI 的 Omni 模型一致；
    # 如果继续把 vy 限成 0，控制器采样与底层执行就会不一致，转角/终点附近会放大预测偏离。
    max_velocity: [1.6, 1.6, 2.2]
    min_velocity: [-1.6, -1.6, -2.2]
    max_accel: [2.5, 2.5, 3.2]
    max_decel: [-2.5, -2.5, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan" # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    enable_stamped_cmd_vel: false
    update_duration: 0.02
    # 启动后先连续发布几拍 TF/odom，再开始发 scan，
    # 避免 RViz / Nav2 的 message filter 在 sim_time 下报“scan 早于 TF 缓存”。
    scan_tf_warmup_cycles: 3
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
