bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    odom_topic: /odom
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # xy_goal_tolerance:
      # 位置到点容差。增大后更容易判定“到点”，能减少终点附近来回试探；
      # 过大则会出现“还没真正贴近目标就提前结束”。
      xy_goal_tolerance: 0.35
      # 这里哨兵巡逻不强调终点朝向，因此保持 2*pi，相当于不约束最终 yaw。
      yaw_goal_tolerance: 6.28
    # MPPI controller parameters (loopback simulation)
    # 这套参数是 loopback 决策仿真默认读取的 MPPI 配置，用于观察：
    # 1. trajectories 是否稳定贴近 transformed_global_plan
    # 2. 转角处是否左右试探 / 反向抽动
    # 3. 终点附近是否蛇形摆动或 overshoot
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # --- Motion model ---
      # Omni: 全向底盘模型，可同时采样 vx / vy / wz。
      motion_model: "Omni"

      # --- Optimizer settings ---
      # time_steps * model_dt = 预测时域长度。
      # 预测太长：容易在窄弯、终点附近“想太远”，可视化 rollout 发散。
      # 预测太短：局部最优，拐弯可能来不及提前收敛。
      time_steps: 35
      # 控制离散步长。一般与 controller_frequency 对齐，这里 0.05 = 20Hz。
      model_dt: 0.13
      # batch_size: 每周期采样多少条轨迹。
      # 更大通常更稳，但更吃算力；过小会让最佳轨迹抖动明显。
      batch_size: 600
      # temperature: softmax 温度。
      # 小：更激进，只盯最优样本，容易抖。
      # 大：更平滑，但也可能变钝。
      temperature: 0.25
      # gamma: 控制序列平滑/能量正则项。
      # 小：更愿意急打急停；大：更平滑，但可能转角收得慢。
      gamma: 0.035
      # iteration_count:
      # 一般 1 就够，增大能提高优化深度，但实时性会下降。
      iteration_count: 1
      # shift_control_sequence:
      # 用上周期最优控制序列平移后做 warm-start，可显著减少抖动。
      shift_control_sequence: true
      # retry_attempt_limit:
      # 若当前采样几乎全碰撞时，允许再尝试几次。loopback 中保持 1 足够。
      retry_attempt_limit: 1

      # --- Velocity constraints (loopback sim - TurtleBot3-like) ---
      # 这些是 MPPI 采样空间的硬约束，不只是“实际最大速度”。
      # 设得过大时，即使真实机器人跑不到，采样也会过分发散，导致 trajectories 乱飘。
      vx_max: 1.6
      vx_min: -1.6
      vy_max: 1.6
      vy_min: -1.6
      wz_max: 2.2
      wz_min: -2.2

      # --- Sampling standard deviations ---
      # std 决定每周期围绕当前控制序列“抖多大”。
      # 过大：rollout 像扇形散开，中途和终点附近都容易左右试探。
      # 过小：会变得保守，局部最优卡住时不容易跳出来。
      vx_std: 0.25
      vy_std: 0.25
      wz_std: 0.40

      # --- Critics ---
      # critics 是代价项列表。MPPI 会综合这些 critic 给每条采样轨迹打分。
      # 一般不要一口气同时改很多 critic，建议一次只改 1~2 个核心项。
      critics: [
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "ObstaclesCritic",
        "ConstraintCritic",
        "TwirlingCritic",
        "VelocityDeadbandCritic"
      ]

      PathAlignCritic:
        enabled: true
        cost_power: 1
        # PathAlignCritic:
        # 惩罚轨迹偏离路径中心线。
        # 大了会更“贴线”，但转角和障碍附近容易僵硬、来回修正。
        cost_weight: 10.0
        # threshold_to_consider:
        # 离终点较近时逐步弱化该 critic，避免终点还在死命贴路径导致蛇形。
        threshold_to_consider: 0.7
        # offset_from_furthest:
        # 用路径前方多远的位置做贴线参考。大了看得更远，容易切弯；小了更保守。
        offset_from_furthest: 12
        # trajectory_point_step:
        # rollout 取样步长，越大越粗略但更省计算。
        trajectory_point_step: 4
        # 当局部路径大量落在高占用区域时，不再强行贴线，避免“为贴线去撞障”。
        max_path_occupancy_ratio: 0.05
        # loopback 巡逻更关注位置，不强依赖路径姿态。
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        # PathFollowCritic:
        # 鼓励沿路径整体往前推进，而不是只盯着贴中心线。
        # 它比 PathAlign 更“宽松”，更像“顺着大方向走”。
        cost_weight: 5.0
        # 适当提高后，终点更早由 GoalCritic 接管，不会一直被路径项拽着跑。
        threshold_to_consider: 1.8
        # 越大越倾向追逐更远的 follow 点，速度会快，但转角更容易 shortcut。
        offset_from_furthest: 4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        # PathAngleCritic:
        # 处理“轨迹朝向与路径前进方向严重不一致”的情况。
        # 它通常是抑制反向试探、横着切弯的重要项。
        cost_weight: 3.0
        threshold_to_consider: 0.7
        offset_from_furthest: 4
        # 允许的最大夹角，越小越严格。
        # 太小可能导致拐弯发僵；太大则反向/横漂更容易出现。
        max_angle_to_furthest: 0.75
        # 全向底盘不强行前向偏置，否则侧移优势会被压掉。
        forward_preference: false
      GoalCritic:
        enabled: true
        cost_power: 1
        # GoalCritic:
        # 惩罚轨迹末端离目标点的距离，是“终点收敛”的第一核心参数。
        # 如果接近目标时还在左右晃，优先考虑提高它或提高它的生效距离。
        cost_weight: 8.0
        # 值越大，越早进入“以目标点为主”的阶段，而不是继续死跟路径。
        threshold_to_consider: 1.8
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        # 这里虽然不严格要求终点朝向，但保留适度角度约束能减少末端乱摆。
        cost_weight: 3.0
        threshold_to_consider: 0.7
        # true 表示朝向误差按对称方式处理，适合这里“不关心最终面朝哪边”的场景。
        symmetric_yaw_tolerance: true
      ObstaclesCritic:
        enabled: true
        consider_footprint: true
        cost_power: 1
        # repulsion_weight:
        # 越大越早躲障，但也更容易把可视化 trajectories 顶得离路径很远。
        repulsion_weight: 1.5
        # critical_weight:
        # 近碰撞区域的重惩罚，通常保持远大于一般路径 critic。
        critical_weight: 20.0
        # collision_margin_distance:
        # 在真实碰撞边界外再加一层“心理安全距离”。
        collision_margin_distance: 0.1
        # near_goal_distance:
        # 终点附近降低障碍回避敏感度，避免“最后贴点时被微小代价场推开”。
        near_goal_distance: 0.5
        # 这里要与 local_costmap inflation 参数大致一致，否则 critic 语义会错位。
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
      ConstraintCritic:
        enabled: true
        cost_power: 1
        # 惩罚违反速度/加速度等运动学约束的轨迹，通常保持中等权重即可。
        cost_weight: 4.0
      TwirlingCritic:
        enabled: true
        cost_power: 1
        # 抑制原地乱转。若看到临近终点疯狂转圈，可以适当增大。
        cost_weight: 10.0
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        # 惩罚“很小但非零”的速度，防止控制输出在死区附近来回抖。
        # 终点附近轻微抽搐时，这项通常很有用。
        cost_weight: 35.0
        deadband_velocities: [0.05, 0.05, 0.05]

      # --- Visualization ---
      # 开启后 RViz 可查看 rollout 采样轨迹，是 MPPI 调参最重要的诊断窗口之一。
      visualize: true
      TrajectoryVisualizer:
        # trajectory_step / time_step 越大，显示越稀疏；便于看趋势，不影响控制本身。
        trajectory_step: 5
        time_step: 3

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      # local_costmap 的窗口至少要能覆盖 MPPI 的主要预测范围。
      # 如果局部地图比 rollout 还短，就会出现“预测总顶到边界”的假性发散。
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: "/Users/zhiangqi/robostack/nav2_loopback_sim/maps/tb3_sandbox.yaml"

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 0.0, 1.0]
    min_velocity: [-2.0, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan" # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    enable_stamped_cmd_vel: false
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
