pb2025_sentry_behavior_server:
  ros__parameters:
    use_sim_time: true
    action_name: pb2025_sentry_behavior
    tick_frequency: 5
    groot2_port: 17777
    ros_plugins_timeout: 1000
    use_cout_logger: false

    plugins:
      - pb2025_sentry_behavior/bt_plugins

    behavior_trees:
      - pb2025_sentry_behavior/behavior_trees

    decision:
      input_source: simulation

      goal_points:
        x: [0.2, 5.38, 3.6, 0.0]
        y: [0.18, 2.2, 3.6, 0.0]
        z: [0.0, 0.0, 0.0, 0.0]

      point_roles:
        supply_safe_point_index: 0
        patrol_indices: [1, 2]
        low_hp_candidate_indices: [1, 2]
        critical_time_target_index: 1
        anchor_target_index: 2

      simulation:
        default_mode: patrol
        mode_topic: decision/sim_mode

      referee:
        start_gate:
          expected_game_progress: 4
          min_remain_time: 0
          max_remain_time: 420

      topics:
        spin: cmd_spin
        cmd_vel: cmd_vel
        gimbal_cmd: cmd_gimbal
        # 哨兵姿态模式话题：
        # 0=move，1=attack，2=defend。
        robot_mode: decision/robot_mode

      motion:
        default_spin_speed: 7.0
        # 检测到新的掉血后的自旋角速度。
        hit_spin_speed: 7.0
        # 最近一次掉血后，若在该时长内没有新的掉血，则停止自旋。
        hit_spin_stop_after_no_hp_drop_s: 2.0

      mode_thresholds:
        # current_hp <= defend_hp 时，主树可切入 defend 相关分支。
        defend_hp: 300

      mode_limits:
        # 姿态切换冷却时间，防止 move/attack/defend 高频抖动。
        switch_cooldown_s: 5.0
        # 每局比赛内单一姿态允许累计存在的最大时长。
        max_cumulative_s: 180.0

      vision:
        topic: vision/target
        timeout_s: 0.5
        attack_radius: 2.0
        follow_occupied_threshold: 50
        follow_sample_count: 16
        follow_arc_half_angle_deg: 90.0
        min_replan_interval_s: 0.4
        min_goal_shift_m: 0.35
        visualization_enabled: true
        visualization_topic: decision/vision_follow_markers

      pose:
        expected_frame: map
        timeout_s: 0.5

      time_thresholds:
        abundant: 300
        normal: 240
        tense: 120
        critical: 40

      hp_thresholds:
        abundant:
          high: 400
          medium: 300
          low: 120
        normal:
          high: 400
          medium: 300
          low: 150
        tense:
          high: 400
          medium: 300
          low: 150
        critical:
          high: 400
          medium: 300
          low: 150

      decision_config:
        path_tolerance: 0.2
        nav2_action_server: "/navigate_through_poses"
        decision_period_ms: 100
        goal_position_tolerance: 0.2
        waypoint_stop_duration_s: 0.3
        patrol_preview_points: 1
        action_server_wait_timeout_s: 0.5

pb2025_sentry_behavior_client:
  ros__parameters:
    use_sim_time: true
    target_tree: vision_test
