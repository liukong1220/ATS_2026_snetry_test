standard_robot_pp_ros2:
  ros__parameters:
    device_name: /dev/ttyACM0
    baud_rate: 115200
    flow_control: none
    parity: none
    stop_bits: "1"
    set_detector_color: false
    record_rosbag: true
    debug: false
    # 三自由度云台 TF 由 ID_JOINT_STATE 中的 big_yaw/small_yaw/pitch 反馈驱动。
    # IMU 仅作为姿态传感器发布，不再把 imu yaw/pitch 冒充 gimbal_yaw/pitch joint。
    publish_imu_as_gimbal_joint_state: false
    # 下位机已升级到三字段 joint 包后，应关闭旧两字段兼容模式，
    # 避免误接老协议时静默退化成“只有大 yaw 正确”的半残 TF。
    accept_legacy_two_axis_joint_state: false
    # 若下位机上报的小 yaw 实际上是“炮口/IMU 绝对 yaw”，
    # 可先把它转换成相对大 yaw 的关节角再进 TF，作为联调阶段兜底。
    small_yaw_is_relative: true
    invert_small_yaw: false
    small_yaw_offset: 0.0
    # 当上游偶发掉出 1~3 帧全零速度时，短暂保持最近一次非零速度，
    # 避免底盘被打成“走一拍、停一拍”的电机冲击。
    enable_transient_zero_cmd_hold: true
    transient_zero_cmd_hold_timeout_ms: 50
    transient_zero_cmd_linear_epsilon: 0.001
    transient_zero_cmd_angular_epsilon: 0.001
    # 上游彻底断流时，最多保留旧速度这么久，超时后主动刹停。
    cmd_vel_watchdog_timeout_ms: 300
    # 订阅上层行为树发布的姿态模式话题，
    # 并将值写入 SendRobotCmdData.data.speed_vector.mode。
    robot_mode_topic: decision/robot_mode


robot_decision:
  ros__parameters:
    # 点位索引语义说明（以下索引与 goal_points.x / goal_points.y / goal_points.z 一一对应）
    # 索引0：补给安全点。危急血量时固定回撤到这里。
    # 索引1：巡逻点1。当前配置中也作为“时间严重紧张”时的强制目标点。
    # 索引2：巡逻点2。正常血量巡逻使用，也可加入低血量候选列表。
    # 索引3：巡逻点3。正常血量巡逻使用，也可加入低血量候选列表。
    goal_points:  # 目标点坐标数组（对应代码中的 rmul_goal_point_）

    # BLUE
      x: [0.2, 5.38, 3.6, 0.0]   # 各索引点的 x 坐标
      y: [0.18, 2.2, 3.6, 0.0]   # 各索引点的 y 坐标
      z: [0.0, 0.0, 0.0, 0.0]    # 各索引点的 z 坐标，默认平面运动场景

    # RED
      # x: [21.8, 9.5, 5.0, 2.0, 5.5, 0.0]
      # y: [6.0, 2.8, -3.5, -3.0, 6.1, 0.0]
      # z: [0.0, 0.0, 0.0, 0.0, 0.4, 0.0]

    point_roles:
      supply_safe_point_index: 0          # 补给安全点索引：危急血量时回撤到这里
      patrol_indices: [1, 2]           # 正常血量巡逻点索引列表：按 1->2->3->2->1 往返巡逻
      low_hp_candidate_indices: [1, 2] # 低血量最近退防点候选索引列表：只在这些点中选最近点
      critical_time_target_index: 1       # 时间严重紧张时的强制目标点索引

    time_thresholds:  # 时间阶段阈值（单位：秒）
      abundant: 300    # 时间充足阈值
      normal: 240      # 时间正常阈值
      tense: 120   # 时间紧张阈值
      critical: 40     # 极度紧张阈值

    hp_thresholds:    # 血量判断阈值
      abundant:  # 时间充足阶段
        high: 400      # 高血量阈值
        medium: 220    # 中血量阈值
        low: 120        # 低血量阈值
      normal:    # 时间正常阶段
        high: 400      # 高血量阈值
        medium: 250     # 中血量阈值
        low: 150        # 低血量阈值
      tense:     # 时间紧张阶段
        high: 400
        medium: 250
        low: 150
      critical:  # 极度紧张阶段
        high: 400
        medium: 250
        low: 150

    decision_config:
      path_tolerance: 0.2  # 路径执行容差（米）
      nav2_action_server: "/navigate_to_pose"  # 导航动作服务名称
      decision_period_ms: 100
      goal_republish_interval_s: 1.5
      goal_position_tolerance: 0.1
      waypoint_stop_duration_s: 0.0

joint_state_publisher:
  ros__parameters:
    use_sim_time: false
    rate: 200
    source_list: ["serial/gimbal_joint_state"]
    offset_timestamp: 0.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: false
    publish_frequency: 200.0
    
